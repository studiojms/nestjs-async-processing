services:
  mongo:
    image: mongo:8
    command: ["mongod", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: ["node", "dist/main.js"]
    ports: ["3000:3000"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/patient_events
      PORT: 3000
    depends_on:
      mongo: { condition: service_healthy }
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/patient_events
      WORKER_POLL_MS: 100
      LOCK_LEASE_MS: 30000
      PROCESSING_DELAY_MS: 5000
    depends_on:
      mongo: { condition: service_healthy }
    deploy:
      replicas: 3
volumes:
  mongo-data:
