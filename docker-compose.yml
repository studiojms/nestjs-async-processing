services:
  mongo:
    image: mongo:8
    command: ["mongod", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: ["node", "dist/main.js"]
    ports: ["${PORT:-3000}:${PORT:-3000}"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/patient_events
      PORT: ${PORT:-3000}
      MONGO_POOL_SIZE: ${MONGO_POOL_SIZE:-50}
    depends_on:
      mongo: { condition: service_healthy }
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/patient_events
      MONGO_POOL_SIZE: ${MONGO_POOL_SIZE:-50}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-100}
      LOCK_LEASE_MS: ${LOCK_LEASE_MS:-30000}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-0}
    depends_on:
      mongo: { condition: service_healthy }
    deploy:
      replicas: 3
volumes:
  mongo-data:
